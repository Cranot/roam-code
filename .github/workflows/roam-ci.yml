# CI pipeline for roam-code itself.
#
# Jobs:
#   test         — pytest across all supported Python versions (3.10–3.13;
#                   3.9 dropped 2026-05-16 per pyproject requires-python).
#   lint         — ruff format/lint check (Python 3.12 only, fast gate)
#   self-analysis — roam analyses its own codebase on PRs using the local
#                   composite action (uses: ./), posting a sticky comment
#                   and uploading SARIF to GitHub Code Scanning.
#
# For the example template that downstream users copy into their repos,
# see .github/workflows/roam.yml (dormant, workflow_dispatch only).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # setup-python supplies every interpreter. Never let uv silently fetch a
  # different runtime, re-lock metadata, or hide progress-dependent output.
  UV_LOCKED: "1"
  UV_NO_PROGRESS: "1"
  UV_PYTHON_DOWNLOADS: "never"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -- Test suite across all supported Python versions -----------------------
  # Ubuntu-only: roam-code is pure Python with no compiled extensions; a
  # single-OS matrix covers correctness without the 3x cost of a full matrix.
  # Use -m "not slow" to skip timing-sensitive performance tests that are
  # prone to flaking under CI resource constraints.
  #
  # 3.9 dropped 2026-05-16: pyproject.toml requires-python = ">=3.10". The
  # 3.9 matrix entry was failing every PR with "Package 'roam-code' requires
  # a different Python: 3.9.25 not in '>=3.10'".
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    env:
      # pytest-xdist worker count, consumed by src/roam/testing/ci_xdist.py
      # (code default stays 2 so local/other consumers are unchanged).
      #
      # The 2-worker cap was a BLIND SIGBUS mitigation landed 2026-07-08 08:42
      # (b74fc2b6) -- hours BEFORE either real root cause was diagnosed. Both
      # were found and closed the same day, and both fixes are structural
      # rather than headcount-dependent:
      #   - the shared-.pyc assertion-rewrite race (2b881d24) is gone because
      #     no .pyc is written at all: sys.dont_write_bytecode is set in the
      #     controller AND every worker, so there is no shared file to race on
      #     no matter how many workers exist;
      #   - the 1 GB SQLite mmap (cd887438) is gone because mmap_size=0 under
      #     CI+xdist, with cache_size (64 MB -> 8 MB) and temp_store
      #     (MEMORY -> FILE) bounded alongside it (7765098c), so per-worker
      #     memory is small and constant instead of gigabyte-scale.
      # Grammar-heavy index builds are additionally serialized onto one worker
      # by xdist_group("grammar_heavy") (e0ee4360). Nothing ever re-tested the
      # cap after those landed. The suite is also subprocess-heavy (286 test
      # modules shell out), so at 2 workers a 4-vCPU runner sits part-idle.
      ROAM_XDIST_WORKERS: "3"
    # Measured at 2 workers, `Run tests` step wall clock, 2026-07-28:
    #   run 30331612772  3.10 44m05s  3.11 43m45s  3.12 39m47s  3.13 38m28s
    #   run 30331709179  3.10 51m45s  3.11 39m21s  3.12 39m28s  3.13 36m13s
    #   run 30334868017  3.10 41m31s  3.11 36m50s  3.12 37m37s  3.13 42m38s
    #   run 30344348643  3.10 49m56s  3.11 36m52s  3.12 41m53s  3.13 36m57s
    # 3.10 is the slowest lane in 3 of those 4 and peaked at 51m45s -- 86% of
    # this cap -- but it is NOT a 3.10-only problem: on 30334868017 the 3.13
    # lane was slowest, and the whole matrix sits in a 36-52 min band. Run-to-
    # run variance on a single lane is ~10 min, larger than the gap between
    # lanes. That band is why the timeout was bumped three times
    # (20 -> 30 -> 45 -> 60), each bump consumed by ordinary growth within a
    # few releases. A fourth bump is not on the table: the lever is the worker
    # count above, not the clock. A genuine hang still trips this cap.
    timeout-minutes: 60
    strategy:
      fail-fast: false   # let all Python versions report; don't abort early
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # full history needed for git-stats and pr-risk tests
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync the exact dev graph
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          python -I -S -B scripts/verify_uv_runtime.py
          uv sync --locked --no-default-groups --extra dev --python python
          .venv/bin/python - <<'PY'
          import os
          import sys

          expected = tuple(map(int, os.environ["EXPECTED_PYTHON"].split(".")))
          assert sys.version_info[:2] == expected, (sys.version, expected)
          PY
          uv pip check --python .venv/bin/python

      # Build the repo's own index on ONE lane so the dogfood tests that borrow
      # it actually execute. ~19 tests gate on a ready roam-code index (cycles
      # dispatch, coupling, bare-filename resolution, CGA attestation); CI never
      # built one, so they skipped on every run and contributed zero coverage
      # while the lane reported green. Skipping cleanly was the safety fix after
      # they raced a half-built index -- running them is the point.
      #
      # One lane, not four: the index costs ~2.5 min to build and the tests are
      # interpreter-independent, so paying for it four times buys nothing. The
      # other lanes still skip, guarded by tests/_helpers/repo_index.py.
      - name: Build the repo index (dogfood coverage lane)
        if: matrix.python-version == '3.12'
        run: .venv/bin/python -m roam index --quiet

      # No ``-x``. Fail-fast on the authoritative lane is information loss: all
      # four Python lanes rediscover the same earliest failure and withhold the
      # rest, so a suite with N broken tests reports 1 and takes N pushes to
      # clear. Concretely, main was red 2026-07-23..26 behind a rotating single
      # symptom -- an empty-input index probe, then a fatal-DB envelope, then a
      # dogfood index guard, then a bare console-script invocation -- each only
      # visible once its predecessor was fixed. Report the whole inventory in
      # one run; exit status is unchanged, so a red suite is still red.
      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -q -m "not slow"

  # -- Exact dependency security gate across every supported Python --------
  # Audit the same lock selections CI executes, including CI-only build and
  # document tooling. --local audits installed versions rather than resolving
  # ranges; --strict makes collection failures fatal. No advisory is ignored.
  dependency-audit:
    name: Dependency audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Materialize the exact audited graph
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          python -I -S -B scripts/verify_uv_runtime.py
          uv sync --locked --no-default-groups --extra dev --group ci --group ci-fallback --no-install-project --python python
          .venv/bin/python - <<'PY'
          import importlib.metadata
          import os
          import sys

          expected = tuple(map(int, os.environ["EXPECTED_PYTHON"].split(".")))
          assert sys.version_info[:2] == expected, (sys.version, expected)
          distributions = list(importlib.metadata.distributions())
          assert len(distributions) >= 20, "refusing to audit a vacuous environment"
          names = {distribution.metadata["Name"].lower() for distribution in distributions}
          assert "roam-code" not in names, "first-party editable project leaked into the dependency audit"
          PY
          uv pip check --python .venv/bin/python
          test "$(.venv/bin/pip-audit --version)" = "pip-audit 2.10.1"

      - name: Fail on any known vulnerability or collection error
        run: |
          .venv/bin/pip-audit \
            --local \
            --strict \
            --progress-spinner off \
            --vulnerability-service pypi \
            --timeout 30

  # -- No-optional-deps lane: actually exercise fallback paths --------------
  # The 2026-05-01 CI session caught a class of latent bugs where ImportError
  # fallbacks (no scipy → degree-based PageRank, no leiden → Louvain, no
  # onnxruntime → empty semantic scores) returned shapes that violated their
  # documented contract. Tests passed because they happened to use the real
  # library. This lane installs *only* the base dependencies + pytest, so
  # ``tests/test_fallback_contracts.py`` actually runs the fallback path that
  # production users without optional extras will hit. One Python version is
  # enough; the matrix above covers grammar/version drift.
  test-no-optional-deps:
    name: Fallback contracts (minimal dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync only base and fallback-test dependencies
        run: |
          python -I -S -B scripts/verify_uv_runtime.py
          uv sync --locked --no-default-groups --group ci-fallback --python python
          .venv/bin/python - <<'PY'
          import importlib.util

          for module in ("scipy", "igraph", "leidenalg", "onnxruntime"):
              assert importlib.util.find_spec(module) is None, f"{module} made the fallback lane non-minimal"
          PY
          uv pip check --python .venv/bin/python

      - name: Run only the fallback-contract suite
        run: .venv/bin/python -m pytest tests/test_fallback_contracts.py -v

  # -- Lint (ruff) -----------------------------------------------------------
  # Fast code style / lint gate. Only needs to pass on one Python version.
  lint:
    name: Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Audit tracked script exec bits
        run: bash scripts/test-exec-bits.sh

      - name: Shellcheck tracked scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck --severity=error --external-sources "${scripts[@]}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync the exact lint graph
        run: |
          python -I -S -B scripts/verify_uv_runtime.py
          uv sync --locked --no-default-groups --extra dev --python python
          uv pip check --python .venv/bin/python

      - name: Ruff format check
        run: .venv/bin/ruff format --check src/ tests/

      - name: Ruff lint
        run: .venv/bin/ruff check src/ tests/

  # -- Doc hygiene: anti-drift gates ---------------------------------------
  # Gates that catch the most common doc-rot patterns:
  #   - test_no_internal_language.py — fail if any tracked file matches a
  #     forbidden internal-session pattern (Pass NN, Phase X of v2, dogfood
  #     notes YYYY-MM-DD, personal Windows paths, day-job customer names).
  #   - sync_surface_counts.py — fail if README/llms-install/server.json
  #     quote stale command/MCP-tool/language counts.
  #   - linkcheck.py — fail if any internal landing-page link 404s.
  #   - strip_metadata.py — fail if any tracked PDF/PNG/SVG has identifying
  #     metadata (author, creator, EXIF, embedded paths).
  doc-hygiene:
    name: Documentation hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # for the test that uses git ls-files
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync the exact documentation graph
        run: |
          python -I -S -B scripts/verify_uv_runtime.py
          uv sync --locked --no-default-groups --extra dev --group ci --python python
          uv pip check --python .venv/bin/python

      - name: Anti-leak language gate
        run: .venv/bin/python -m pytest tests/test_no_internal_language.py -v

      - name: Surface-count drift gate
        run: .venv/bin/python scripts/sync_surface_counts.py

      - name: README/CLAUDE/llms-install count drift gate
        run: .venv/bin/python dev/build_readme_counts.py --check

      - name: Changelog-render drift gate
        run: .venv/bin/python scripts/build_changelog_html.py

      - name: Internal-link integrity
        run: .venv/bin/python scripts/linkcheck.py --strict

      - name: Binary metadata gate
        run: .venv/bin/python scripts/strip_metadata.py

  # -- Wheel-built smoke: drift-guards under a real pip install -------------
  # W577: the wheel-drift suite (tests/test_package_data_wheel_drift.py) is a
  # NO-OP under editable installs (`pip install -e .`) because
  # ``importlib.resources.files(...)`` falls back to a filesystem walk that
  # resolves anything physically on disk in src/, whether or not
  # ``[tool.setuptools.package-data]`` in pyproject.toml ships it. W554 was
  # exactly that bug — templates/audit-report/control-mapping.yaml resolved
  # in dev but was missing from every pip-install user's wheel.
  #
  # This lane builds the wheel with ``python -m build``, installs it into a
  # FRESH venv (no editable resolution), and runs the drift tests from a
  # working directory OUTSIDE the source checkout so the wheel install is
  # the only resolution path. If any package-data glob regresses, this lane
  # fails before merge — not after the bad wheel ships to PyPI.
  wheel-smoke:
    name: Installed-wheel smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync the exact build and smoke-test graph
        run: |
          python -I -S -B scripts/verify_uv_runtime.py
          uv sync --locked --no-default-groups --extra dev --group ci --python python
          uv pip check --python .venv/bin/python

      - name: Build wheel
        run: .venv/bin/python -m build --no-isolation --wheel

      - name: Install wheel with a hash-locked graph into a fresh venv
        run: |
          requirements="${RUNNER_TEMP}/wheel-test-requirements.txt"
          environment="${RUNNER_TEMP}/wheel-test"
          uv export \
            --locked \
            --no-default-groups \
            --extra dev \
            --group ci \
            --no-emit-project \
            --no-annotate \
            --output-file "${requirements}"
          grep -q -- '--hash=sha256:' "${requirements}"
          uv venv "${environment}" --python python
          uv pip sync \
            --python "${environment}/bin/python" \
            --require-hashes \
            --strict \
            "${requirements}"
          mapfile -t wheels < <(compgen -G 'dist/roam_code-*.whl')
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "Expected exactly one roam-code wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          uv pip install --python "${environment}/bin/python" --no-deps "${wheels[0]}"
          uv pip check --python "${environment}/bin/python"

      - name: Run wheel-drift tests against the installed wheel
        # cwd OUTSIDE the source tree so importlib.resources resolves
        # ONLY through the installed wheel — never through the src/
        # filesystem fallback that editable installs use.
        run: |
          cp tests/test_package_data_wheel_drift.py /tmp/test_wheel_drift.py
          cd /tmp
          "${RUNNER_TEMP}/wheel-test/bin/python" -m pytest /tmp/test_wheel_drift.py -x -v

      - name: Smoke-run roam evidence-oscal from the wheel
        # Sanity: the wheel-bundled control-mapping.yaml resolves AND
        # produces non-empty OSCAL JSON with control entries. Belt-and-
        # suspenders for the drift-guard above: even if the test file
        # were ever skipped, an actual end-user invocation must work.
        run: |
          cd /tmp
          "${RUNNER_TEMP}/wheel-test/bin/roam" evidence-oscal --kind control-mapping > /tmp/oscal.json
          "${RUNNER_TEMP}/wheel-test/bin/python" -c "import json; d=json.load(open('/tmp/oscal.json')); assert 'control-mapping' in d or 'controls' in d or 'components' in d or len(d)>0, 'OSCAL JSON empty'; print(f'OSCAL JSON OK: {len(d)} top-level keys')"

  # -- Self-analysis: roam eats its own dog food on PRs ----------------------
  # Runs the local composite action (uses: ./) to analyse this repo on every
  # pull request. Posts a sticky PR comment with health score and pr-risk,
  # uploads SARIF findings to GitHub Code Scanning, and enforces a soft
  # health gate (>=50) so the job fails loudly if quality degrades.
  self-analysis:
    name: Roam self-analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write   # sticky PR comment from the local action
      security-events: write # SARIF upload from the local action
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # full history required for pr-risk and git analysis
          persist-credentials: false

      # Bind prerelease self-analysis to this exact local action checkout.
      # Explicit source mode has no PyPI fallback, so an unpublished version
      # can test itself without weakening downstream exact-version defaults.
      - uses: ./            # local composite action — tests action.yml itself
        with:
          version: 'source'
          commands: 'health pr-risk'
          changed-only: 'true'
          sarif: 'true'
          sarif-commands: 'health'
          sarif-category: 'roam-code-self-analysis'
          comment: 'true'
          gate: 'health_score>=50'
          python-version: '3.12'
