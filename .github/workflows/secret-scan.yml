name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  UV_LOCKED: "1"
  UV_NO_PROGRESS: "1"
  UV_PYTHON_DOWNLOADS: "never"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Blocking secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync the exact dev graph
        run: |
          python -I -S -B scripts/verify_uv_runtime.py
          uv sync --locked --no-default-groups --extra dev --python python
          uv pip check --python .venv/bin/python

      - name: Run cmd_secrets gate
        run: .venv/bin/roam secrets --fail-on-found

      - name: Run repo leak catalogue gate
        run: .venv/bin/python scripts/scan_internal_language.py --all

      # Tracked-but-ignored gate. Same failure shape as the two gates above --
      # a file everyone believes is excluded, publishing on every push -- but
      # this class survives being "audited clean", because the natural audit
      # (`git ls-files | xargs git check-ignore`) returns zero hits always:
      # check-ignore skips indexed paths unless --no-index is passed.
      # Needs fetch-depth 0 only for the checkout above; the check itself
      # reads the index and the ignore rules, never history.
      # --fail-on-found exits 5 on UNANALYZABLE as well as VIOLATION, so a
      # check that could not run cannot pass as clean.
      - name: Run tracked-but-ignored gate
        run: .venv/bin/roam ignore-drift --fail-on-found
