name: Dogfood (roam on roam)

# DF.1 / DF.18 — eat our own cooking publicly. On every PR + push to main:
#   1. Install roam-code from this checkout
#   2. Run `roam dogfood` (audit + pr-analyze + audit-trail + conformance)
#   3. Surface verdict + score in the workflow summary
#   4. Post a sticky PR comment via `roam pr-comment-render`
#   5. Upload the audit trail as a workflow artifact for compliance review
#
# This workflow uses the same engines that ship to customers — when it
# breaks, customers will too. When it passes, our trust signal is real.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# Cancel stale dogfood runs when a new commit lands on the same PR / branch.
# Unlike publish + cga-attestation, dogfood is a pure read-only audit with
# no external side effects (no PyPI upload, no Rekor entry, no release asset
# mutation), so cancelling the old run on a force-push or rapid commit
# sequence is the right trade-off — saves CI minutes and keeps the sticky
# PR comment fresh against the latest tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LOCKED: "1"
  UV_NO_PROGRESS: "1"
  UV_PYTHON_DOWNLOADS: "never"

jobs:
  dogfood:
    name: Roam dogfood
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write   # post the sticky PR comment
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # FULL history, not a window. `fetch-depth: 50` was "enough for
          # pr-prep churn analysis" and silently wrong for the retrieval gate
          # below, which compares against numbers published from a normal
          # (full) clone.
          #
          # `git_cochange` is a ranking signal, and its table is built from
          # whatever history the checkout has. Measured 2026-08-12 at
          # 74520ca5, same binary, same corpus, index byte-identical across
          # all three arms (5001 files / 46783 symbols / 97304 edges):
          #
          #   full history (2575 commits)   recall@20 = 0.9139
          #   git_cochange emptied          recall@20 = 0.8778
          #   fetch-depth: 50               recall@20 = 0.8500
          #
          # Note the ordering: a shallow clone scores BELOW an empty table.
          # Deleting the signal falls back cleanly; 50 commits supply a
          # partial, recency-biased one that actively mis-ranks. So this was
          # not a small environmental offset to be absorbed by tolerance — it
          # was a 0.064 bias, the entire +/-0.06 budget, permanently spent
          # before a real regression could ever be seen. The gate went red on
          # 2026-08-11 only because corpus churn spent the last 0.014.
          #
          # Cost of the change: one clone of a ~2.6k-commit repository.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync the exact runtime graph
        run: |
          python -I -S -B scripts/verify_uv_runtime.py
          uv sync --locked --no-default-groups --python python
          uv pip check --python .venv/bin/python

      - name: Index repo
        run: .venv/bin/roam index

      - name: Run dogfood (audit + pr-analyze + audit-trail + conformance)
        run: |
          set -euo pipefail
          # --audit-trail is the default (no flag needed) -- a prior
          # --no-audit-trail here structurally disabled the very
          # audit-trail + conformance checking this step's own name and
          # the workflow header promise, which silently printed
          # `| conformance | None/100 |` on every run. Each CI run starts
          # from a fresh checkout (.roam/ is gitignored, never persisted
          # across runs), so this appends exactly one genesis record and
          # reports that trail's real Article 12 conformance score.
          .venv/bin/roam --json dogfood > dogfood.json
          .venv/bin/python - <<'PY'
          import json
          import os
          import pathlib

          env = json.loads(pathlib.Path("dogfood.json").read_text(encoding="utf-8"))
          assert env.get("command") == "dogfood", env
          s = env.get("summary") or {}
          assert isinstance(s, dict), env
          sections = set(s.get("sections_run") or [])
          missing = {"audit", "pr_analyze"} - sections
          assert not missing, f"dogfood omitted required sections: {sorted(missing)}"
          verdict = s.get("verdict", "?")
          health = s.get("health_score", "?")
          pr_verdict = s.get("pr_verdict", "?")
          conf = s.get("conformance_score", "?")
          summary_md = (
              f"## Roam dogfood verdict\n\n"
              f"**{verdict}**\n\n"
              f"| metric | value |\n|---|---|\n"
              f"| health | {health}/100 |\n"
              f"| pr-analyze | {pr_verdict} |\n"
              f"| conformance | {conf}/100 |\n"
          )
          gh_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if gh_summary:
              pathlib.Path(gh_summary).write_text(summary_md, encoding="utf-8")
          if s.get("partial_success"):
              failed = s.get("failed_sections") or s.get("warnings_out") or "undisclosed sections"
              raise SystemExit(f"dogfood execution degraded: {failed}")
          PY

      # The retrieval numbers in bench/retrieve/{README,SUBMISSION}.md are
      # public claims that open with "run this command". They went stale for
      # three minor versions -- README published 0.503 recall@20 while the
      # retriever actually delivered 0.914 -- because nothing re-derived them.
      # This step is that missing re-derivation. It runs here rather than in a
      # new workflow because `Index repo` above already builds a FULL index on
      # a fresh checkout, which is the only state the numbers are valid against
      # (an incrementally-maintained index scores ~13 points lower on the same
      # commit; see SUBMISSION.md 'Known defects').
      - name: Verify published retrieval numbers
        run: |
          set -euo pipefail
          .venv/bin/roam --json eval-retrieve \
            --tasks bench/retrieve/roam_self.jsonl > eval-retrieve.json
          .venv/bin/python bench/retrieve/check_published_recall.py \
            --eval-json eval-retrieve.json

      - name: Render PR comment (pr-analyze on PR diff)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Bind the diff to the event's immutable base commit. Mapping the
          # expression through env keeps event data out of shell source.
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Pull-request base is not a full commit SHA."
            exit 1
          fi
          git fetch --no-tags origin "$BASE_SHA"
          git diff "$BASE_SHA..HEAD" > pr.diff
          # A BLOCK verdict remains advisory in this reporting workflow because
          # --gate is deliberately omitted; process and envelope failures are fatal.
          .venv/bin/roam --json pr-analyze --input pr.diff --explain > pr-analyze.json
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("pr-analyze.json").read_text(encoding="utf-8"))
          assert report.get("command") == "pr-analyze", report
          summary = report.get("summary")
          assert isinstance(summary, dict), report
          assert isinstance(summary.get("verdict"), str), summary
          PY
          .venv/bin/roam pr-comment-render --input pr-analyze.json > pr-comment.md

      - name: Post sticky comment to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: roam-dogfood
          path: pr-comment.md

      # Always retain partial evidence for failed runs; missing evidence is an
      # error, and artifact collection cannot turn a failed gate into success.
      - name: Upload dogfood evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: roam-dogfood-${{ github.run_id }}
          path: |
            dogfood.json
            pr-analyze.json
            pr-comment.md
            eval-retrieve.json
          if-no-files-found: error
          retention-days: 30
